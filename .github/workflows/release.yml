name: Release lazydiff

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Published npm version to finalize
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-lazydiff
  cancel-in-progress: false

jobs:
  release:
    name: Version or release lazydiff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Nub and Node.js
        uses: nubjs/setup-nub@v0
        with:
          node-version: "24"
          nub-version: "0.6.0"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: github.event_name == 'push'
        run: nub install --frozen-lockfile

      - name: Create or update release pull request
        if: github.event_name == 'push'
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore: release"
          title: "chore: release"
          version: nub run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check release state
        if: >-
          github.event_name == 'workflow_dispatch' || steps.changesets.outputs.hasChangesets == 'false'
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$RELEASE_VERSION_INPUT"
          else
            version="$(jq --raw-output .version packages/cli/package.json)"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi

          tag="v${version}"
          tag_exists=false
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tag_exists=true
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] &&
            ! nub view "lazydiff@${version}" version >/dev/null 2>&1; then
            echo "lazydiff@${version} must be public on npm before it can be finalized." >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" != "workflow_dispatch" ]] &&
            ! nub view lazydiff version >/dev/null 2>&1; then
            echo "lazydiff must be published once locally before staged publishing can be used." >&2
            exit 1
          fi

          if nub view "lazydiff@${version}" version >/dev/null 2>&1; then
            release_sha="$(nub view "lazydiff@${version}" gitHead 2>/dev/null || true)"

            if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "lazydiff@${version} does not identify an unambiguous publishing commit." >&2
              exit 1
            fi

            if ! git cat-file -e "${release_sha}^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags origin "$release_sha"; then
                echo "Publishing commit ${release_sha} could not be fetched from this repository." >&2
                exit 1
              fi
            fi

            if ! git cat-file -e "${release_sha}^{commit}" 2>/dev/null; then
              echo "Publishing commit ${release_sha} is unavailable in this repository." >&2
              exit 1
            fi

            published_version="$(git show "${release_sha}:packages/cli/package.json" | jq --raw-output .version)"
            if [[ "$published_version" != "$version" ]]; then
              echo "Publishing commit ${release_sha} contains lazydiff@${published_version}, not ${version}." >&2
              exit 1
            fi

            if [[ "$tag_exists" == "true" ]]; then
              tag_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
              if [[ "$tag_sha" != "$release_sha" ]]; then
                echo "${tag} points to ${tag_sha}, not publishing commit ${release_sha}." >&2
                exit 1
              fi

              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "stage=false" >> "$GITHUB_OUTPUT"
            echo "finalize=true" >> "$GITHUB_OUTPUT"
            echo "sha=${release_sha}" >> "$GITHUB_OUTPUT"
          else
            if [[ "$tag_exists" == "true" ]]; then
              echo "${tag} exists before lazydiff@${version} is public on npm." >&2
              exit 1
            fi

            echo "stage=true" >> "$GITHUB_OUTPUT"
            echo "finalize=false" >> "$GITHUB_OUTPUT"
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check out published source
        if: steps.release.outputs.finalize == 'true'
        run: git checkout --detach "${{ steps.release.outputs.sha }}"

      - name: Install published dependencies
        if: steps.release.outputs.finalize == 'true'
        run: nub install --frozen-lockfile

      - name: Validate release
        if: steps.release.outputs.release == 'true'
        run: |
          nub run check
          nub run check-types
          nub run test
          nub run build

      - name: Stage package on npm
        if: steps.release.outputs.stage == 'true'
        working-directory: packages/cli
        run: nub exec npm stage publish

      - name: Prepare release notes
        if: steps.release.outputs.finalize == 'true'
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          changelog="packages/cli/CHANGELOG.md"
          release_notes_body="packages/cli/dist/release-notes-body.md"
          release_notes="packages/cli/dist/release-notes.md"

          awk -v version="$version" '
            $0 == "## " version {
              found = 1
              next
            }
            found && /^## / {
              exit
            }
            found {
              print
            }
            END {
              if (!found) {
                exit 1
              }
            }
          ' "$changelog" > "$release_notes_body"

          if ! grep -q '[^[:space:]]' "$release_notes_body"; then
            echo "No changelog entry found for ${version}" >&2
            exit 1
          fi

          {
            printf "## What's Changed\n"
            cat "$release_notes_body"
          } > "$release_notes"

      - name: Create tag and GitHub release
        if: steps.release.outputs.finalize == 'true'
        run: |
          gh release create \
            "${{ steps.release.outputs.tag }}" \
            --notes-file packages/cli/dist/release-notes.md \
            --target "${{ steps.release.outputs.sha }}" \
            --title "lazydiff ${{ steps.release.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
